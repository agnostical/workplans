name: CLI tests

on:
  push:
    branches: [main]
    paths: ["cli/**"]
  pull_request:
    paths: ["cli/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
